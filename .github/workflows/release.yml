name: Publicar versao
# Dispara ao criar uma tag como v1.2.0 (veja PUBLICAR.md). Compila EXE e APK e cria o Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  # grava o repositorio no app, para ele saber onde procurar novas versoes
  REPO_INJECT: "const fs=require('fs');for(const f of process.argv.slice(1)){const s=fs.readFileSync(f,'utf8');if(!s.includes(\"HUB_REPO=''\")){console.error('HUB_REPO nao encontrado em '+f);process.exit(1)}fs.writeFileSync(f,s.replace(\"HUB_REPO=''\",\"HUB_REPO='\"+process.env.GITHUB_REPOSITORY+\"'\"))}"
jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(node -p "require('./windows/package.json').version")
          A=$(node -p "require('./android/package.json').version")
          if [ "$V" != "$A" ]; then echo "::error::Versoes diferentes (windows $V, android $A). Use: node tools/lancar.js <versao>"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then echo "::error::A tag ${GITHUB_REF_NAME} nao bate com a versao $V. Use: node tools/lancar.js <versao>"; exit 1; fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
  windows:
    needs: versao
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node -e "$env:REPO_INJECT" app/index.html
        shell: pwsh
      - run: npm install
      - run: node scripts/ensure-electron.js
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: windows/dist/*.exe, if-no-files-found: error }
  android:
    needs: versao
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: node -e "$REPO_INJECT" www/index.html
      # chave fixa: toda versao assinada igual, para o Android aceitar atualizar por cima
      - run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - run: node scripts/build-apk.js
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: android/dist-apk/*.apk, if-no-files-found: error }
  publicar:
    needs: [versao, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: arquivos, merge-multiple: true }
      - run: ls -la arquivos
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.versao.outputs.v }}
        run: |
          gh release create "v$V" arquivos/* --repo "$GITHUB_REPOSITORY" --title "PUNK HUB $V" --generate-notes || gh release upload "v$V" arquivos/* --repo "$GITHUB_REPOSITORY" --clobber
